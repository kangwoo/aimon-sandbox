[server]
host = "0.0.0.0"
port = 8090
api_key = "spike-docker-key-1234567890"
max_sandbox_timeout_seconds = 3600

[proxy]
resolve_internal = false

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "state/opensandbox.db"   # relative to server/ of the checkout

[docker]
network_mode = "bridge"
port_range_min = 41000
port_range_max = 41999
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 4096
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns+nft"
readiness_timeout_seconds = 30.0
