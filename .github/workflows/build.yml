name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The shape of aimon-core's build.yml, trimmed to the two tiers this repository has a runner for, plus core's
# `coverage` job that joins them. `k8sTest` needs a provisioned cluster and stays manual
# (modules/aimon-sandbox-opensandbox/README.md). `scripts/release.sh` gates on every task these jobs run, and
# ReleaseGateMatchesCiGateTest holds the two lists together.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Format check + checkstyle + tests
        run: ./gradlew --no-daemon checkAll

      # Red runs only, and never fatal: a full artifact quota must not overturn what the tests found.
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/*/*.xml
          if-no-files-found: ignore
          retention-days: 7

      # Execution data, not a report: the `coverage` job below is the only workspace holding both tiers, so the
      # raw `.exec` crosses the job boundary and the report is built there. Core's reasoning, carried over:
      # - a tar rather than the bare glob, because `upload-artifact` roots an artifact at the longest common prefix
      #   of what it matched, which silently becomes `modules/<one>/build/jacoco/` the day only one module matches
      #   and restores the file to the wrong path. The tar carries repository-root-relative paths;
      # - the emptiness check, because under `nullglob` a glob matching nothing gives `tar` an empty list, a
      #   zero-entry archive uploads cleanly, and `coverage` would fail the floor on a hand-off that lost the data;
      # - no `if: always()`: exec data from a tier that failed part-way measures nothing anyone should read.
      - name: Archive unit-tier coverage data
        run: |
          shopt -s nullglob
          unit_exec=(modules/*/build/jacoco/test.exec)
          if [ ${#unit_exec[@]} -eq 0 ]; then
            echo "::error::The test task produced no JaCoCo execution data; the coverage job would report every module at 0%."
            exit 1
          fi
          tar -cf jacoco-exec-unit.tar "${unit_exec[@]}"

      # `continue-on-error` on the policy of the upload above; a lost hand-off turns `coverage` red on the missing
      # download instead, which is the honest split: `build` says whether the code is good, `coverage` whether the
      # number could be computed. One day's retention -- a hand-off inside one run.
      - name: Upload unit-tier coverage data
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-unit
          path: jacoco-exec-unit.tar
          retention-days: 1

  # The docker tier (@Tag("docker")): the OpenSandbox provider against a real server that OpenSandboxTestServer
  # starts on the runner's Docker daemon. Its own job so it runs in parallel and a red check names the tier. This is
  # also the only place the tier runs on Linux/amd64 -- the spike and step 4 ran it on macOS arm64 only
  # (docs/design/workspace-sandbox.md §20, "러너에서의 docker 계층").
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Docker integration tests
        run: ./gradlew --no-daemon integrationTest

      - name: Upload integration test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/*/*.xml
          if-no-files-found: ignore
          retention-days: 7

      # The half of the coverage picture this job owns. Only aimon-sandbox-opensandbox has docker-tagged tests, so the
      # other modules write an `integrationTest.exec` that measured nothing -- a Test task writes one whether or not
      # any test matched -- and the provider's is the one that matters. Same tar-not-glob reasoning as `build`.
      - name: Archive docker-tier coverage data
        run: |
          shopt -s nullglob
          exec_data=(modules/*/build/jacoco/integrationTest.exec)
          if [ ${#exec_data[@]} -eq 0 ]; then
            echo "::error::integrationTest produced no JaCoCo execution data; the coverage job would measure the provider without its docker tier."
            exit 1
          fi
          tar -cf jacoco-exec-integration.tar "${exec_data[@]}"

      - name: Upload docker-tier coverage data
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-integration
          path: jacoco-exec-integration.tar
          retention-days: 1

  # Where the coverage number is made, and the only workspace in which it can be true: `build` and `integration`
  # run in parallel with separate workspaces, so a report inside either sees one tier. Until this job the floors in
  # gradle/coverage-baselines.properties were checked by nothing in CI at all.
  #
  # Today every floor is met by the unit tier alone (aimon-sandbox-opensandbox's is set against its fake-server
  # tests), so folding in the docker tier only raises the provider's number. The job is core's shape anyway rather
  # than a step in `build`: the day a module's floor depends on its docker tests, a `build`-only check would report
  # a collapse instead of a tier that did not run.
  #
  # `needs` both tiers, deliberately without `if: always()`: the floor fails the build, and gated on a red tier it
  # would report "coverage dropped" when the real cause was one failing test. `-x test` keeps this a tail job rather
  # than a third test run -- `jacocoTestReport` and the verification declare dependsOn(test) because Gradle 9 fails
  # an undeclared read of `test.exec`, and excluding it reuses the data the other two jobs produced.
  coverage:
    runs-on: ubuntu-latest
    needs: [build, integration]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Read-only unconditionally: this job compiles main sources and nothing else, so it has no cache entry
          # worth writing and no reason to race `build` for the write on main.
          cache-read-only: true

      - name: Download unit-tier coverage data
        uses: actions/download-artifact@v8
        with:
          name: jacoco-exec-unit

      - name: Download docker-tier coverage data
        uses: actions/download-artifact@v8
        with:
          name: jacoco-exec-integration

      # Repository-root-relative paths, so every file lands back under modules/<module>/build/jacoco/ where the
      # fileTree in aimon.java-conventions looks for it. The two tars never name the same file: each job archives
      # exec files named after a task the other never runs. The listing is the evidence -- without it, a hand-off
      # that quietly restored nothing would look exactly like a green run.
      - name: Restore coverage execution data
        run: |
          tar -xf jacoco-exec-unit.tar
          tar -xf jacoco-exec-integration.tar
          find modules -path '*/build/jacoco/*.exec' | sort

      - name: JaCoCo coverage reports
        run: ./gradlew --no-daemon jacocoTestReport -x test

      # After the report, not instead of it: when the floor trips you want the report that explains why, and the
      # upload below carries `if: always()` so it still arrives.
      - name: Coverage floor
        run: ./gradlew --no-daemon jacocoTestCoverageVerification -x test

      # XML only: the HTML regenerates locally with `./gradlew jacocoTestReport`, and a convenience artifact must not
      # overturn what the run found.
      - name: Upload JaCoCo coverage XML
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-xml
          path: modules/*/build/reports/jacoco/*/*.xml
          if-no-files-found: ignore
          retention-days: 7
