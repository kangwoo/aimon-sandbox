org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The group changed when this code left aimon-core, so these are new coordinates rather than a
# continuation of `at.aimon.core:aimon-sandbox`. The version counter restarts with them: claiming 0.2.5
# would assert a release history this group id does not have, and the old coordinate is not being
# withdrawn -- `at.aimon.core:aimon-sandbox:0.2.4` and its two backends stay on Central and keep working
# for anyone already depending on them. See CHANGELOG.md and aimon-core's docs/migration/rename-maps.md.
GROUP=at.aimon.sandbox
VERSION_NAME=0.1.0-SNAPSHOT

POM_URL=https://github.com/kangwoo/aimon-sandbox
POM_INCEPTION_YEAR=2026

# Matches aimon-core, whose SPI this implements and whose artifacts sit on the same classpath.
# The LICENSE file at the repository root is the same text, byte for byte.
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=kangwoo
POM_DEVELOPER_NAME=kangwoo
POM_DEVELOPER_URL=https://github.com/kangwoo

POM_SCM_URL=https://github.com/kangwoo/aimon-sandbox
POM_SCM_CONNECTION=scm:git:git://github.com/kangwoo/aimon-sandbox.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/kangwoo/aimon-sandbox.git

# Publish MD5 and SHA1 checksums only. Central requires no more, and Gradle writes the extra pair for
# every file in the bundle including each `.asc`. Same reasoning, and the same verified-against-Gradle
# caveat, as the property of this name in aimon-core.
systemProp.org.gradle.internal.publish.checksums.insecure=true
