# Version catalog for aimon-sandbox.
#
# A strict subset of the catalog this repository was split out of (aimon-core). Only coordinates something
# here actually resolves are listed: a catalog entry that nothing uses is invisible to every check in the
# build, so it rots without ever failing anything.
#
# `aimon-core` is the one entry that is not a third-party library. It is the framework this repository
# implements an SPI of, and it is consumed as a released artifact from Maven Central rather than as a
# sibling project -- that is the whole point of the split. Raising it is a deliberate act: aimon-core is
# 0.x, so a minor bump there may require changes here. The workspace sandbox needs a core with the
# execution-environment SPI (docs/design/workspace-sandbox.md §7); that bump landed with implementation
# step 3, together with the first code that compiles against it.
#
# 0.3.1 is the first release that carries that SPI together with the cancellation, background-ceiling and
# runtime-binding contracts this code implements (aimon-core PRs #204-#208). Until it was released the pin was
# `0.3.1-SNAPSHOT`, resolved from `~/.m2` through a filtered `mavenLocal()`; both left together.
[versions]
aimon-core = "0.3.1"

lombok = "1.18.48"

# Both are aimon-core's own runtime pins. aimon-core's published `apiElements` exports no dependencies, so
# whatever the sandbox compiles against has to be declared here; matching core's versions keeps one version
# of each on the classpath.
slf4j = "2.0.20"
jackson = "2.22.3"

junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"

# The docker test tier of aimon-sandbox-opensandbox starts an OpenSandbox server per run (docs/design/workspace-sandbox.md
# §16). 2.x is the line that speaks to Docker Engine 29's minimum API version.
testcontainers = "2.0.5"

checkstyle = "10.12.5"
spotless = "8.10.3"
maven-publish = "0.37.0"

[libraries]
aimon-core = { module = "at.aimon.core:aimon-core", version.ref = "aimon-core" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# The BOM is imported as a platform by the conventions plugin, which is what gives the two version-less
# entries below their version. aimon-core leaves them version-less too, but gets the version from
# `spring-boot-starter-test` on the test classpath of every module -- a dependency nothing in this
# repository needs, and an indirection worth dropping rather than porting.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
