# Line-coverage floors, as whole percentages, one per module.
#
# Each floor is the module's measured line coverage rounded down to a whole percent, set in the same change as the
# tests it measures, so it never asks for more than the build already delivers (implementation step 3 design, Q7).
# The floors carried over from aimon-core measured the identifier-based sandbox and were dropped with it; these are
# the workspace sandbox's first. Raise a floor when coverage grows; never lower one to make a change pass.
#
# Measured at implementation step 3: aimon-sandbox 89.45%, aimon-sandbox-testkit 88.41% (`./gradlew test
# jacocoTestReport`, every test in the default tier -- nothing here is @Tag'ed yet).
aimon-sandbox=89
aimon-sandbox-testkit=88
