# Line-coverage floors, as whole percentages, one per module.
#
# Each floor is the module's measured line coverage rounded down to a whole percent, set in the same change as the
# tests it measures, so it never asks for more than the build already delivers (implementation step 3 design, Q7).
# The floors carried over from aimon-core measured the identifier-based sandbox and were dropped with it; these are
# the workspace sandbox's first. Raise a floor when coverage grows; never lower one to make a change pass.
#
# Measured at implementation step 3: aimon-sandbox 89.45%, aimon-sandbox-testkit 88.41% (`./gradlew test
# jacocoTestReport`, every test in the default tier -- nothing here is @Tag'ed yet). After the step-3 follow-up fixes:
# aimon-sandbox 89.80-89.86%, aimon-sandbox-testkit 89.04-89.23% across runs. The testkit floor stays at 88: a few of its
# lines (the kill that lands before perl's setpgrp, a reused process-group id) run only when a race goes one way, and
# a floor of 89 would sit within one line of the lowest run.
#
# Measured at implementation step 4 (`./gradlew test jacocoTestReport`, the default tier only): aimon-sandbox 90.85%,
# aimon-sandbox-testkit 89.17%, aimon-sandbox-opensandbox 86.92%. The provider's floor is its fake-server tests alone,
# so `build` meets it without Docker; its docker tier (`integrationTest`) only adds to the number. The testkit floor
# stays at 88 for the reason above.
aimon-sandbox=90
aimon-sandbox-testkit=88
aimon-sandbox-opensandbox=86
