# Line-coverage floors, as whole percentages. Carried over unchanged from aimon-core, where these three
# numbers were frozen against exactly the tests that moved here with them.
#
# Read them for what they are: coverage of unit tests that stub the Docker and Kubernetes clients. The
# tier that would exercise a real daemon or cluster -- `DockerSandboxBackendIntegrationTest` and
# `KubernetesSandboxBackendIntegrationTest` -- is gated on AIMON_DOCKER_IT / AIMON_KUBERNETES_IT and has
# never had a CI signal, in this repository or the one it came from. A high number here does not say the
# backends talk to their runtimes correctly; nothing in this build says that yet.
aimon-sandbox=88
aimon-sandbox-docker=89
aimon-sandbox-kubernetes=85
